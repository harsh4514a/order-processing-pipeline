version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - app_logs:/usr/src/app/logs
      - app_uploads:/usr/src/app/uploads
    command: node server.js

  postgres:
    image: postgres:16-alpine
    container_name: order-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assessment_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  app_logs:
  app_uploads:
